<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دست به دست | به زودی</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
      max-width: 420px;
      width: 90%;
      border: 1px solid #e2e8f0;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #1e293b; }
    p { color: #64748b; line-height: 1.6; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.75rem;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      cursor: default;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">نسخه آزمایشی</span>
    <h1>اپلیکیشن دست به دست</h1>
    <p>سامانه مدیریت و هماهنگی صندوق‌های گروهی. این سامانه هم‌اکنون در مرحله توسعه و تست نهایی قرار دارد.</p>
    <a href="#" class="btn">دانلود نسخه تستی (به‌زودی)</a>
  </div>
</body>
</html>
